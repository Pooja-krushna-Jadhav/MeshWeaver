[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "0.1.0"
description = "Zero-Dependency Peer-to-Peer Asynchronous Task Broker for Edge Computing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MeshWeaver Contributors"}
]
keywords = ["p2p", "distributed-systems", "edge-computing", "task-broker", "asyncio", "kademlia", "dht"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
full = [
    "cryptography>=41.0.0",
    "cloudpickle>=3.0.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cryptography>=41.0.0",
    "cloudpickle>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
meshweaver = "meshweaver.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
